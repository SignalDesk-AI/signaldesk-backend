name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  node:
    name: Node services
    runs-on: windows-latest
    env:
      CI: true
      NX_DAEMON: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:node

  dotnet:
    name: .NET services
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet --info
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-dotnet.ps1
