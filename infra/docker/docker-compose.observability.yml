name: signaldesk-observability

networks:
  signaldesk:
    name: signaldesk-local
    external: true

volumes:
  grafana-data:
  prometheus-data:
  loki-data:

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: signaldesk-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - signaldesk

  grafana:
    image: grafana/grafana:11.3.0
    container_name: signaldesk-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3009:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboard-json:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - signaldesk

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: signaldesk-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks:
      - signaldesk

  loki:
    image: grafana/loki:3.2.1
    container_name: signaldesk-loki
    command: ["-config.file=/etc/loki/local-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ../monitoring/loki/local-config.yml:/etc/loki/local-config.yml:ro
    networks:
      - signaldesk

  promtail:
    image: grafana/promtail:3.2.1
    container_name: signaldesk-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ../monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ../monitoring/promtail/logs:/var/log/promtail:ro
    depends_on:
      loki:
        condition: service_started
    networks:
      - signaldesk
