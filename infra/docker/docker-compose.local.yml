name: signaldesk-local

networks:
  signaldesk:
    name: signaldesk-local

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:

services:
  postgres:
    image: postgres:16
    container_name: signaldesk-postgres
    environment:
      POSTGRES_DB: signaldesk
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: signaldesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signaldesk

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: signaldesk-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: signaldesk
      DB_PASSWORD: signaldesk
      DB_NAME: signaldesk
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=signaldesk psql -h 127.0.0.1 -p 5432 -U signaldesk -d signaldesk -c 'select 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signaldesk

  mongodb:
    image: mongo:7
    container_name: signaldesk-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signaldesk

  redis:
    image: redis:7
    container_name: signaldesk-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signaldesk

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: signaldesk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: signaldesk
      RABBITMQ_DEFAULT_PASS: signaldesk
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signaldesk

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: signaldesk-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - signaldesk

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: signaldesk-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - signaldesk

  ollama:
    image: ollama/ollama:0.6.8
    container_name: signaldesk-ollama
    ports:
      - "11434:11434"
    networks:
      - signaldesk
