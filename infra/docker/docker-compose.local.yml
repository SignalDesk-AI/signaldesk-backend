name: signaldesk-local

networks:
  signaldesk:
    name: signaldesk-local

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
  elasticsearch-data:
  minio-data:

services:
  postgres:
    image: postgres:16
    container_name: signaldesk-postgres
    environment:
      POSTGRES_DB: signaldesk
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: signaldesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signaldesk

  pgbouncer:
    image: edoburu/pgbouncer:1.24.1-p1
    container_name: signaldesk-pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: signaldesk
      DB_PASSWORD: signaldesk
      DB_NAME: signaldesk
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - signaldesk

  mongodb:
    image: mongo:7
    container_name: signaldesk-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - signaldesk

  redis:
    image: redis:7
    container_name: signaldesk-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signaldesk

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: signaldesk-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signaldesk

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: signaldesk-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - signaldesk

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: signaldesk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: signaldesk
      MINIO_ROOT_PASSWORD: signaldesk123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - signaldesk

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: signaldesk-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - signaldesk

  ollama:
    image: ollama/ollama:0.6.8
    container_name: signaldesk-ollama
    ports:
      - "11434:11434"
    networks:
      - signaldesk
