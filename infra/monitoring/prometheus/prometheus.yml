global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: jaeger
    metrics_path: /metrics
    static_configs:
      - targets:
          - jaeger:14269

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets:
          - loki:3100

  - job_name: backend-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000
          - host.docker.internal:3001
          - host.docker.internal:3002
          - host.docker.internal:3003
          - host.docker.internal:5001
          - host.docker.internal:5002
          - host.docker.internal:5003
          - host.docker.internal:5004
          - host.docker.internal:5005
        labels:
          stack: signaldesk-local
